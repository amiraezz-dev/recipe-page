<!DOCTYPE html>
<html lang="en">

<head>
  <title>Vanilla Cupcakes</title>
  <meta charset="utf-8">
</head>

<body>
  <main>
    <h1>Vanilla Cupcakes</h1>
    <p>This is a quick and easy vanilla cupcake recipe.</p>
    <section>
      <h2>Ingredients</h2>

      <h3>cupcakes</h3>
      <ul>
        <li> 1 cup butter</li>
        <li>1 cup sugar</li>
        <li>3 eggs</li>
        <li>1 cup flour</li>
        <li>1 tsp vanilla</li>
        <li>0.25 cup milk</li>
      </ul>

      <h3>Icing</h3>
      <ul>
      <li>1 cup sugar</li>
      <li>1 cup butter</li>
      <li>2 tsp vanilla</li>
      <li>0.25 cup milk</li>
      </ul>
    </section>
  </main>
</body>

</html>
